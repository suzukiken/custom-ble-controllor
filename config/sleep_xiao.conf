CONFIG_ZMK_BLE=y
CONFIG_ZMK_USB=n
CONFIG_ZMK_HID_INDICATORS=n
CONFIG_ZMK_SLEEP=y
# Stay awake long enough after D0 status trigger to finish typing the line.
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=20000
CONFIG_ZMK_BATTERY_REPORTING=y
CONFIG_ZMK_BATTERY_REPORT_INTERVAL=60
# Status typed when RP2040 pulses D0 (default every 5 min).
CONFIG_ZMK_SOAK_STATUS=y
CONFIG_ZMK_SOAK_STATUS_MODE="sleep"
