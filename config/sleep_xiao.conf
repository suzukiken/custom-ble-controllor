CONFIG_ZMK_BLE=y
CONFIG_ZMK_USB=n
CONFIG_ZMK_HID_INDICATORS=n
CONFIG_ZMK_SLEEP=y
# Sleep soon after each page-turn so most of a 30s interval is deep sleep.
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=5000
CONFIG_ZMK_BATTERY_REPORTING=y
CONFIG_ZMK_BATTERY_REPORT_INTERVAL=60
# Type time/power into the host every 10 minutes.
CONFIG_ZMK_SOAK_STATUS=y
CONFIG_ZMK_SOAK_STATUS_INTERVAL_SEC=600
CONFIG_ZMK_SOAK_STATUS_INITIAL_DELAY_SEC=30
CONFIG_ZMK_SOAK_STATUS_MODE="sleep"
