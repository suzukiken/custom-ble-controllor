CONFIG_ZMK_BLE=y
CONFIG_ZMK_USB=n
CONFIG_ZMK_HID_INDICATORS=n
# Same as sleep_xiao, but status every 5 minutes for bring-up.
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=5000
CONFIG_ZMK_BATTERY_REPORTING=y
CONFIG_ZMK_BATTERY_REPORT_INTERVAL=60
CONFIG_ZMK_SOAK_STATUS=y
CONFIG_ZMK_SOAK_STATUS_INTERVAL_SEC=300
CONFIG_ZMK_SOAK_STATUS_INITIAL_DELAY_SEC=15
CONFIG_ZMK_SOAK_STATUS_MODE="sleep5min"
