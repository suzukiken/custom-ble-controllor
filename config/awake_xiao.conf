CONFIG_ZMK_BLE=y
CONFIG_ZMK_USB=n
CONFIG_ZMK_HID_INDICATORS=n
# Same 30s finger load as sleep_xiao, but never deep-sleep.
CONFIG_ZMK_SLEEP=n
CONFIG_ZMK_BATTERY_REPORTING=y
CONFIG_ZMK_BATTERY_REPORT_INTERVAL=60
# Type time/power into the host every 10 minutes.
CONFIG_ZMK_SOAK_STATUS=y
CONFIG_ZMK_SOAK_STATUS_INTERVAL_SEC=600
CONFIG_ZMK_SOAK_STATUS_INITIAL_DELAY_SEC=30
