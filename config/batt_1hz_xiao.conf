CONFIG_ZMK_BLE=y
CONFIG_ZMK_USB=n
CONFIG_ZMK_HID_INDICATORS=n
# Always-on soak: ~1 key/s from RP2040 — no deep sleep.
CONFIG_ZMK_SLEEP=n
CONFIG_ZMK_BATTERY_REPORTING=y
CONFIG_ZMK_BATTERY_REPORT_INTERVAL=60
# Type u<sec>p<% >v<mv> into the host every 5 minutes (ZMK module).
CONFIG_ZMK_SOAK_STATUS=y
CONFIG_ZMK_SOAK_STATUS_INTERVAL_SEC=300
CONFIG_ZMK_SOAK_STATUS_INITIAL_DELAY_SEC=15
