CONFIG_ZMK_BLE=y
CONFIG_ZMK_USB=n
CONFIG_ZMK_HID_INDICATORS=n
# Same as awake_xiao, but status every 1 minute for bring-up.
CONFIG_ZMK_SLEEP=n
CONFIG_ZMK_BATTERY_REPORTING=y
CONFIG_ZMK_BATTERY_REPORT_INTERVAL=60
CONFIG_ZMK_SOAK_STATUS=y
CONFIG_ZMK_SOAK_STATUS_INTERVAL_SEC=60
CONFIG_ZMK_SOAK_STATUS_INITIAL_DELAY_SEC=15
CONFIG_ZMK_SOAK_STATUS_MODE="awake1min"
