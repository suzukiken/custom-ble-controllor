CONFIG_ZMK_BLE=y
CONFIG_ZMK_USB=n
CONFIG_ZMK_HID_INDICATORS=n
CONFIG_ZMK_SLEEP=y
# Long window for BlueZ pair/connect (and to debug reconnect storms).
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=180000
CONFIG_ZMK_BATTERY_REPORTING=y
CONFIG_ZMK_BATTERY_REPORT_INTERVAL=60
CONFIG_ZMK_SOAK_STATUS=y
CONFIG_ZMK_SOAK_STATUS_MODE="sleeppi"

# No passkey on device (no digit keys). Just Works only.
CONFIG_ZMK_BLE_PASSKEY_ENTRY=n

# Raspberry Pi / BlueZ: abort-by-local often tracks 2M PHY negotiation.
CONFIG_ZMK_BLE_EXPERIMENTAL_CONN=y
CONFIG_BT_CTLR_PHY_2M=n
CONFIG_BT_AUTO_PHY_UPDATE=n

# Allow re-pair when host/keyboard bond state disagrees.
CONFIG_BT_SMP_ALLOW_UNAUTH_OVERWRITE=y
CONFIG_BT_KEYS_OVERWRITE_OLDEST=y

# Avoid GATT subscription edge cases with BlueZ HID + battery.
CONFIG_BT_GATT_ENFORCE_SUBSCRIPTION=n
