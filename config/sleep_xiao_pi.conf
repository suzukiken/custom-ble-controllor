CONFIG_ZMK_BLE=y
CONFIG_ZMK_USB=n
CONFIG_ZMK_HID_INDICATORS=n
CONFIG_ZMK_SLEEP=y
# Longer window so BlueZ pair/connect can finish before deep sleep.
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=60000
CONFIG_ZMK_BATTERY_REPORTING=y
CONFIG_ZMK_BATTERY_REPORT_INTERVAL=60
CONFIG_ZMK_SOAK_STATUS=y
CONFIG_ZMK_SOAK_STATUS_MODE="sleeppi"

# Raspberry Pi / BlueZ: HCI often aborts LE links that negotiate 2M PHY.
# EXPERIMENTAL_CONN currently disables PHY 2M (same as CONFIG_BT_CTLR_PHY_2M=n).
CONFIG_ZMK_BLE_EXPERIMENTAL_CONN=y
CONFIG_BT_CTLR_PHY_2M=n

# Allow re-pair when host/keyboard bond state disagrees (common after Pi retries).
CONFIG_BT_SMP_ALLOW_UNAUTH_OVERWRITE=y
CONFIG_BT_KEYS_OVERWRITE_OLDEST=y

# Avoid GATT subscription edge cases seen with BlueZ HID + battery.
CONFIG_BT_GATT_ENFORCE_SUBSCRIPTION=n
