name: Build batt monitor

on:
  push:
    paths:
      - "batt_monitor_xiao/**"
      - ".github/workflows/build-batt-monitor.yml"
  pull_request:
    paths:
      - "batt_monitor_xiao/**"
      - ".github/workflows/build-batt-monitor.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup arduino-cli
        uses: arduino/setup-arduino-cli@v2

      - name: Install Seeed nRF52 core
        run: |
          sudo ln -sf "$(which python3)" /usr/local/bin/python
          arduino-cli config init
          arduino-cli config add board_manager.additional_urls \
            https://files.seeedstudio.com/arduino/package_seeeduino_boards_index.json
          arduino-cli core update-index
          arduino-cli core install Seeeduino:nrf52

      - name: Compile and make UF2
        run: |
          mkdir -p out
          PLATFORM="$HOME/.arduino15/packages/Seeeduino/hardware/nrf52"
          TINYUSB=$(find "$PLATFORM" -type d -name Adafruit_TinyUSB_Arduino | head -n 1)
          UF2CONV=$(find "$PLATFORM" -name uf2conv.py | head -n 1)
          test -n "$TINYUSB"
          test -n "$UF2CONV"
          arduino-cli compile \
            --fqbn Seeeduino:nrf52:xiaonRF52840 \
            --library "$TINYUSB" \
            --output-dir out \
            batt_monitor_xiao
          HEX=$(find out -name '*.hex' | head -n 1)
          test -n "$HEX"
          python3 "$UF2CONV" -f 0xADA52840 -c -o out/xiao-nrf52840-batt-monitor.uf2 "$HEX"
          ls -la out

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: batt-monitor-firmware
          path: out/xiao-nrf52840-batt-monitor.uf2
