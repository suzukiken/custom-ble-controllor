name: Build RP2040 tester

on:
  push:
    paths:
      - "tester-rp2040/**"
      - ".github/workflows/build-rp2040.yml"
  pull_request:
    paths:
      - "tester-rp2040/**"
      - ".github/workflows/build-rp2040.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup arduino-cli
        uses: arduino/setup-arduino-cli@v2

      - name: Install RP2040 core
        run: |
          arduino-cli config init
          arduino-cli config add board_manager.additional_urls \
            https://github.com/earlephilhower/arduino-pico/releases/download/global/package_rp2040_index.json
          arduino-cli core update-index
          arduino-cli core install rp2040:rp2040

      - name: Compile UF2
        run: |
          mkdir -p out
          arduino-cli compile \
            --fqbn rp2040:rp2040:seeed_xiao_rp2040 \
            --output-dir out \
            tester-rp2040
          ls -la out
          UF2=$(find out -name '*.uf2' | head -n 1)
          test -n "$UF2"
          cp "$UF2" out/xiao-rp2040-key-tester.uf2

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: rp2040-tester-firmware
          path: out/xiao-rp2040-key-tester.uf2
